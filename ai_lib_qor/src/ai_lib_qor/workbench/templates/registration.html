<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>确认交付</title><link rel="stylesheet" href="{{ url_for('static',filename='workbench.css') }}"><main class="detail-main"><a href="{{ url_for('index',view='discover') }}">← 返回库扫描</a><section class="panel"><h2>确认登记交付</h2><p>{{ source.vendor_id }} / {{ source.source_library_id }} / {{ version }} · {{ files|length }} 个文件</p><p>请逐项确认文件位，登记不会自动创建 IP 或采纳版本。文件变化后须重新扫描。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="vendor" value="{{ source.vendor_id }}"><input type="hidden" name="library" value="{{ source.source_library_id }}"><input type="hidden" name="version" value="{{ version }}"><input type="hidden" name="scan_id" value="{{ scan.scan_id }}"><div class="task-filter"><label>交付 ID<input required name="delivery_id" placeholder="例如 delivery_001"></label><label>供应商版本<input required name="supplier_version" value="{{ version }}"></label><label>交付顺序<input required type="number" min="0" name="delivery_order"></label><label>交付类型<select name="package_mode"><option value="FULL">完整交付</option><option value="INCREMENTAL">增量交付</option><option value="PATCH">补丁</option><option value="UNKNOWN">未知</option></select></label></div><div class="table-wrap"><table><thead><tr><th>相对路径</th><th>确认文件位</th></tr></thead><tbody>{% for file in files %}<tr><td><code>{{ file }}</code></td><td><label><span class="sr-only">{{ file }} 的文件位</span><input name="file_key_{{ loop.index0 }}" required placeholder="例如 library:lef:core"></label></td></tr>{% endfor %}</tbody></table></div><button>确认登记</button></form></section></main></html>

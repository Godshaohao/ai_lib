[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lib-qor"
version = "0.4.0"
description = "File-driven IP library provenance, effective versioning, FileFacts parsing, and pluggable QoR checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "XlsxWriter>=3.0,<4",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
ai-lib-qor = "ai_lib_qor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_lib_qor.workbench" = ["templates/*.html", "static/*"]

[tool.setuptools.data-files]
"share/ai_lib_qor/schemas" = ["schemas/*.schema.json"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

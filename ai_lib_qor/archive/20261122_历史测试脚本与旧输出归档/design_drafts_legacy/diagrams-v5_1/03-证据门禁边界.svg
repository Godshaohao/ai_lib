<rect x="880" y="215" width="640" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="898" y="247" class="label">可信输入与执行证据</text>
<text x="898" y="275" class="body">确认文件身份、上下文与关联关系</text>
<rect x="880" y="355" width="640" height="130" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="898" y="387" class="label">检查结论和覆盖</text>
<text x="898" y="415" class="body">映射 v3 状态；无证据或覆盖不足不能 PASS</text>
<text x="898" y="439" class="body">校验 Gate 的测量依赖与计算上下文</text>
<rect x="880" y="525" width="640" height="130" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="898" y="557" class="label">v3 Schema + 发布</text>
<text x="898" y="585" class="body">字段映射、结构和业务校验通过后发布</text>
<text x="898" y="609" class="body">失败保留旧结果</text>
<line x1="1200" y1="320" x2="1200" y2="352" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1200" y1="485" x2="1200" y2="522" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="790" class="body">复核发现：用普通文件引用替代 Gate 的测量引用，同时伪造不存在的依赖，原型仍会通过。</text>
<text x="50" y="865" class="small">依据：v5.1 补充文档、原型代码和现有 src_qor；区分现状与方案  |  测试边界：合成夹具</text>

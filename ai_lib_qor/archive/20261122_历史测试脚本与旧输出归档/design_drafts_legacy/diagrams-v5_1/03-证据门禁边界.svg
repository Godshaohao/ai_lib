<rect width="1600" height="920" fill="#ffffff"/>
<text x="50" y="58" class="title">03  证据门禁：现有原型覆盖到哪里</text>
<text x="50" y="95" class="sub">原型验证 v5 合成 Run 的引用和摘要；正式 v3 组装、覆盖语义和真实来源接入仍待实现</text>
<rect x="50" y="150" width="700" height="585" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="68" y="182" class="label">补充包已有：evidence_guard.py</text>
<rect x="80" y="215" width="640" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="98" y="410" class="body">完成项需要输入引用及证据</text>
<text x="98" y="434" class="body">来源路径须在指定目录内，SHA256 须匹配</text>
<text x="98" y="458" class="body">默认拒绝 REUSED；Gate 有基本依赖检查</text>
<rect x="80" y="535" width="640" height="120" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="98" y="567" class="label">局限</text>
<text x="98" y="595" class="body">未接正式数据生产者与 v3 合并器</text>
<text x="98" y="619" class="body">不证明文件内容是有效 Parser 结果</text>
<line x1="400" y1="315" x2="400" y2="347" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400" y1="495" x2="400" y2="532" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="850" y="150" width="700" height="585" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>

function diagramBox(k,caption){let s=DB.diagrams[k];if(!s)return `<div class="callout">此组件的 C4 代码图尚未建模，请先补充可验证的代码元素及依赖，再重新生成。</div>`;return `<div class="toolbar"><span class="tool-left">◈ ${esc(caption)}</span><div class="tool-right"><span style="font-size:11px;color:#7A90A8" id="zoomLabel">100%</span><button id="zin" title="放大">＋</button><button id="zout" title="缩小">－</button><button id="zreset" title="适配窗口">适配</button><button id="focus" title="扩大绘图区">专注</button><button id="svgsave" title="下载当前 SVG 矢量图">SVG ↓</button></div></div><div class="diagram" id="graph"><div class="diagramwrap" id="dg">${s}</div></div><div class="tipline"><span class="key"><i class="dot purple"></i>人员</span><span class="key"><i class="dot blue"></i>系统/组件</span><span class="key"><i class="dot gray"></i>外部依赖</span><span class="key"><i class="dot green"></i>数据存储</span><span class="key"><i class="dot gold"></i>产物/判断</span><span>点击节点可查看职责、接口和下一层。</span></div>`}
const desc=DB.model.page_content.descriptions;

const contextStr={c1:'系统全局',c2:'系统内部',c3:'Python 内部',c4:'组件内部'};
function crumbs(){return `<div class="crumbs"><button class="${S.layer==='c1'?'current':''}" data-layer="c1">${esc(DB.model.page_content.system_short)} · C1</button><span>›</span><button class="${S.layer==='c2'?'current':''}" data-layer="c2">${esc(DB.model.page_content.container_short)} · C2</button><span>›</span><button class="${S.layer==='c3'?'current':''}" data-layer="c3">Python 组件 · C3</button><span>›</span><button class="${S.layer==='c4'?'current':''}" data-layer="c4">${esc(S.module)}/ · C4</button></div>`}

function appC4(){const isC4=S.layer==='c4';let key=isC4?'c4_'+S.module:S.layer;let d=desc[S.layer];return `<div class="eyebrow">C4 MODEL / STRUCTURAL VIEWS</div><div class="titleline"><div><h1>${esc(d[0])} · ${isC4?esc(S.module+'/'):contextStr[S.layer]}</h1><p class="subtitle">${esc(d[2])}</p></div></div>${crumbs()}${isC4?`<div class="flowtabs">${DB.modules.map(x=>`<button class="${S.module===x[0]?'active':''}" data-module="${x[0]}">${x[0]}/</button>`).join('')}</div>`:''}${diagramBox(key,d[1])}${S.layer==='c3'?componentMatrix():''}<div class="below"><section class="pane"><h3>${isC4?'本组件的代码结构约束':'架构图如何帮助开发？'}</h3>${isC4?`<p>${esc(DB.code[S.module].note)}</p><ul><li>实线：当前组件内部的拟议调用；虚线：对其他组件或数据存储的外部依赖。</li><li>点击代码单元检查输入输出；点击上方路径返回同一体系的上层。</li><li>代码结构应随源码审查后再将 PROPOSED 改为 VERIFIED。</li></ul>`:`<ul><li>先明确 <b>系统边界</b>，再逐层放大某一个边界内的元素。</li><li>每条箭头必须说明依赖或交换的信息，不用箭头代替执行流程。</li><li>执行顺序、分支和异常在“业务流程图”中独立表达。</li></ul>`}</section><section class="pane"><h3>在实际场景中验证</h3><p>${esc(DB.model.page_content.scenario_question)}</p><button class="secondary" data-openflow="raw">打开带分支的完整流程 →</button><p style="margin-top:12px">亦可查看 <b>work/ 权威目录</b>，识别每个组件的真实输出记录。</p><button class="secondary" data-page="data">查看数据目录 →</button></section></div>`}
function appFlow(){let t={raw:['RAW 增量更新 → 完整有效版本','业务流程含失败与人工决策分支；它描述运行行为，而非静态的 C4 Component 图。'],formal:['正式 NL 链接 → 固定快照','正式 NL 与 RAW/Effective Revision 可能不同步，不应自动合并成一个版本号。'],plugin:['检查插件 → 标准 CheckRun','既有检查脚本可以黑盒调用；插件各自实现，统一输入输出与证据记录。']}[S.flow];return `<div class="eyebrow">RUNTIME VIEW / DECISION FLOW</div><h1>${esc(t[0])}</h1><p class="subtitle">${esc(t[1])}</p><div class="flowtabs"><button data-flow="raw" class="${S.flow==='raw'?'active':''}">01 · RAW → Revision → 采纳</button><button data-flow="formal" class="${S.flow==='formal'?'active':''}">02 · Formal NL 状态</button><button data-flow="plugin" class="${S.flow==='plugin'?'active':''}">03 · 黑盒检查插件</button></div>${diagramBox('flow_'+S.flow,'运行流 / 判断条件 / 结果分支')}<div class="below"><section class="pane"><h3>流程图和 C4 如何对应？</h3><table class="mini-table"><tr><th>业务动作</th><th>C3 主责组件</th><th>持久数据</th></tr>${[['发现交付 / 正式盘点','sources/','DeliveryRecord / FormalSnapshot'],['解析 Macro/Cell/Pin','parsers/','FileFacts'],['选择并固定 Revision','versions/','EffectiveVersion'],['比较与联动检查','checks/','CheckRun'],['写入 / 更新索引','storage/','EffectiveIndex'],['只读汇总展示','reporting/','HTML / Excel']].map(x=>`<tr><td>${x[0]}</td><td><a href="#" data-module="${x[1].replace('/','')}">${x[1]}</a></td><td>${x[2]}</td></tr>`).join('')}</table></section><section class="pane"><h3>必须区分的三件事</h3><p><b>latest calculated</b>：计算生成的最新有效 Rev；<br/><b>current accepted</b>：用户当前采纳 Rev；<br/><b>formal linked</b>：正式 NL 固定快照实际链接的来源。</p><p>这三者的变化是独立事件，不能由一次 PASS 或新交付自动串联。</p><button class="secondary" data-page="data">查看对应数据契约 →</button></section></div>`}
function appData(){return `<div class="eyebrow">DATA ARCHITECTURE / SOURCE OF TRUTH</div><h1>数据流与业务目录</h1><p class="subtitle">源码结构用于解释“程序怎么执行”；work/ 用于解释“业务事实存在哪里”。二者不是同一个层级，也不能用目录树替代 C4。</p><div class="flowtabs"><button data-data="lineage" class="${S.data!=='tree'&&S.data!=='contracts'?'active':''}">数据血缘图</button><button data-data="tree" class="${S.data==='tree'?'active':''}">源码 + work/ 目录</button><button data-data="contracts" class="${S.data==='contracts'?'active':''}">七类数据契约</button></div>${S.data==='tree'?`<div class="tree" id="tree">${DB.tree.map(([t,id,desc])=>`<div class="tree-item" data-node="${esc(id)}"><span class="${t.trim().endsWith('/')?'dir':'file'}">${esc(t)}</span><span class="desc">    # ${esc(desc)}</span></div>`).join('')}</div><div class="callout">工作目录只是建议的组织方式，实际 work root 可配置；正式 NL 快照只保留一份公共事实；无 BusinessIP 的库可直接维护独立有效集。跨来源库引用通过 source_ref，而不是复制多个版本权威。</div>`:S.data==='contracts'?`<table class="contracts"><thead><tr><th>契约</th><th>典型文件</th><th>生产者</th><th>主要消费者</th><th>负责回答</th></tr></thead><tbody>${DB.contracts.map(c=>`<tr data-node="${c[0]}"><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>${c[4]}</td></tr>`).join('')}</tbody></table>`:diagramBox('lineage','主要数据契约 · 谁生成 / 谁消费')}<div class="below"><section class="pane"><h3>四种权威业务记录</h3><table class="mini-table"><tr><th>记录</th><th>回答的问题</th></tr><tr><td>DeliveryRecord</td><td>这次交付实际出现过什么？</td></tr><tr><td>FormalSnapshot</td><td>正式库固定状态链接了什么？</td></tr><tr><td>EffectiveVersion</td><td>某一 Rev 完整采用哪些文件？</td></tr><tr><td>CheckRun</td><td>变化与检查结果有何证据？</td></tr></table></section><section class="pane"><h3>不要引入第二套权威</h3><p>FileLocator、历史时间线、总览页和 Excel 属于可重建的查询/展示结果。交付、正式快照、有效版本和检查才是固定可追溯的业务记录。</p><button class="secondary" data-data="tree">展开物理目录 →</button></section></div>`}
function appDomain(){return `<div class="eyebrow">DOMAIN VIEW / DDD SUPPLEMENT</div><h1>业务对象与关系</h1><p class="subtitle">它是 C4 的领域模型补充，而不是把 Vendor、BusinessIP、Revision 等对象错误地伪装成 Python Component。</p>${diagramBox('domain','领域关系 · 归属、版本链与来源引用')}<div class="below"><section class="pane"><h3>关键领域约束</h3><ul><li>SourceLibrary 不必须拥有 BusinessIP；未归属文件仍可保留原始历史。</li><li>一个 BusinessIP 可以关联多个 SourceLibrary，默认有一套 EffectiveSet，必要时增加集合。</li><li>Formal NL 是公共来源，不能复制到各个 Vendor 目录形成多个权威。</li></ul></section><section class="pane"><h3>真正的有效版本</h3><p>Revision 是一份可独立还原的完整成员集合；Delivery 和 FormalSnapshot 只是它的固定来源引用，不能直接等同于 Revision 版本号。</p><button class="secondary" data-module="versions">展开版本计算组件 C4 →</button></section></div>`}
function inspect(){const id=S.selected;const e=meta(id);let children=hasChild(id);const m=DB.modules.find(x=>x[0]===id);const cont=DB.contracts.find(x=>x[0]===id);return `<div class="inspect-h">ELEMENT INSPECTOR · 点击图中节点</div><h2 class="inspect-title">${esc(e.name)}</h2><span class="status">${esc(e.status||e.typ||'PROPOSED')}</span><p class="inspect-text">${esc(e.summary)}</p>${e.path?`<div class="inspect-section"><h4>路径 / 实现位置</h4><code class="path">${esc(e.path)}</code></div>`:''}${m?`<div class="inspect-section"><h4>黑盒契约 · 输入 / 输出</h4><div class="kv"><b>输入</b><br/>${esc(m[4])}<br/><br/><b>输出</b><br/>${esc(m[5])}</div></div><div class="inspect-section"><h4>不能违反的约束</h4><div class="kv">${esc(m[6])}</div></div>`:''}${cont?`<div class="inspect-section"><h4>典型文件与来源</h4><code class="path">${esc(cont[1])}</code><div class="kv" style="margin-top:10px"><b>生产者</b>：${esc(cont[2])}<br/><b>消费者</b>：${esc(cont[3])}</div></div><div class="inspect-section"><h4>核心字段</h4><div class="kv">${esc(cont[5])}</div></div><div class="inspect-section"><h4>业务不变量</h4><div class="kv">${esc(cont[6])}</div></div>`:''}${e.rule&&!m?`<div class="inspect-section"><h4>业务约束</h4><div class="kv">${esc(e.rule)}</div></div>`:''}<div class="inspect-section"><h4>关联操作</h4><div class="inspect-actions">${children?`<button class="primary" data-drill="${esc(id)}">放大此元素 →</button>`:''}${DB.modules.some(x=>x[0]===id)?`<button class="secondary" data-module="${esc(id)}">打开 ${esc(id)}/ C4</button>`:''}${(e.typ==='Data contract'||cont)?`<button class="secondary" data-data="contracts">查看数据契约</button>`:''}${id==='runner'?`<button class="secondary" data-page="flow">查看运行流程</button>`:''}</div></div><div class="hint">${S.layer==='c4'&&S.page==='c4'?'C4 代码节点名称均为拟议设计，不等于实际文件已经存在。':'正确的 C4 下钻只展开选中元素的内部结构；运行流程和领域数据作为辅助视图。'}</div>`}
function pick(id){S.selected=id;let els=[...document.querySelectorAll('g.node')];els.forEach(n=>n.classList.toggle('selected',n.id==='node_'+id));q('#inspector').innerHTML=inspect()}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===S.page));q('#layers').classList.toggle('show',S.page==='c4');document.querySelectorAll('[data-layer]').forEach(n=>n.classList.toggle('active',n.dataset.layer===S.layer));let html=S.page==='c4'?appC4():S.page==='flow'?appFlow():S.page==='data'?appData():appDomain();q('#main').innerHTML=html;q('#inspector').innerHTML=inspect();if(q('#dg'))zoom(1);if(q('#focus'))q('#focus').textContent=document.body.classList.contains('focus')?'退出专注':'专注';if(q('#graph'))q('#graph').querySelectorAll('g.node').forEach(n=>{n.setAttribute('tabindex','0');n.setAttribute('role','button');let id=n.id.replace(/^node_/,'');n.setAttribute('aria-label',meta(id).name||id)});document.title=`ai_lib · ${S.page==='c4'?S.layer.toUpperCase():S.page} · Architecture Navigator · 可维护版`;}
function zoom(v){S.zoom=Math.max(.65,Math.min(2.4,v));let el=q('#dg');if(el)el.style.width=100*S.zoom+'%';let z=q('#zoomLabel');if(z)z.textContent=Math.round(S.zoom*100)+'%'}
function drill(id){if(id==='ai_lib')setLayer('c2');else if(id==='runner')setLayer('c3');else if(DB.modules.some(x=>x[0]===id))setModule(id)}
document.addEventListener('click',ev=>{const node=ev.target.closest('g.node');if(node){pick(node.id.replace(/^node_/,''));return}const d=ev.target.closest('[data-page],[data-layer],[data-module],[data-flow],[data-data],[data-node],[data-drill],[data-openflow]');if(d){ev.preventDefault();if(d.dataset.page)setPage(d.dataset.page);else if(d.dataset.layer)setLayer(d.dataset.layer);else if(d.dataset.module)setModule(d.dataset.module);else if(d.dataset.flow){S.flow=d.dataset.flow;S.page='flow';render()}else if(d.dataset.data){S.data=d.dataset.data;S.page='data';render()}else if(d.dataset.node)pick(d.dataset.node);else if(d.dataset.drill)drill(d.dataset.drill);else if(d.dataset.openflow){S.flow=d.dataset.openflow;setPage('flow')}return}if(ev.target.id==='zin')zoom(S.zoom+.2);if(ev.target.id==='zout')zoom(S.zoom-.2);if(ev.target.id==='zreset')zoom(1);if(ev.target.id==='focus'){document.body.classList.toggle('focus');let b=q('#focus');if(b)b.textContent=document.body.classList.contains('focus')?'退出专注':'专注'}if(ev.target.id==='svgsave'){const s=q('#dg svg');if(s){let blob=new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml;charset=utf-8'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ai_lib_'+(S.page==='c4'?S.layer+'_'+S.module:S.page==='flow'?'flow_'+S.flow:S.page)+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),700)}}if(ev.target.id==='export'){let b=new Blob([JSON.stringify(DB.model,null,2)],{type:'application/json;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ai_lib_architecture_model_v5.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}if(ev.target.id==='help')alert('使用方式：①点击 C1 的 ai_lib 节点，并选“放大此元素”；②依次进入 C2 / C3；③点击任意 Python 模块进入 C4；④从“业务流程图”切换 RAW、Formal、黑盒检查；⑤在“数据流/目录”查看源码结构与 7 类持久化契约。所有代码单元均为 PROPOSED，非现有源码审计。')});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('g.node')){ev.preventDefault();pick(ev.target.id.replace(/^node_/,''))}});
render();
</script></body></html>

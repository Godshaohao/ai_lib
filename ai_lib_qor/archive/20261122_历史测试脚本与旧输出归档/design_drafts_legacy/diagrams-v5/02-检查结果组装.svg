<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#2563eb"/></marker></defs>
<style>text {font-family: "Noto Sans CJK SC", sans-serif;} .title{font-size:31px;font-weight:700;fill:#111827}.sub{font-size:17px;fill:#64748b}.label{font-size:21px;font-weight:700;fill:#111827}.body{font-size:17px;fill:#475569}.small{font-size:15px;fill:#64748b}.tiny{font-size:14px;fill:#64748b}</style>
<rect width="1600" height="1030" fill="#ffffff"/>
<text x="50" y="58" class="title">02  多个检查脚本如何汇总为一份 Run</text>
<text x="50" y="95" class="sub">目标、文件来源、Corner、插件版本和参数由检查计划固定</text>
<rect x="475" y="135" width="650" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="493" y="167" class="label">固定本次检查输入</text>
<text x="493" y="195" class="body">Delivery 或 Effective Revision + File Facts + Profile</text>
<rect x="475" y="300" width="650" height="95" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="493" y="332" class="label">Planner / Input Resolver</text>
<text x="493" y="360" class="body">选择插件和锁定输入；插件不自行猜测最新文件</text>

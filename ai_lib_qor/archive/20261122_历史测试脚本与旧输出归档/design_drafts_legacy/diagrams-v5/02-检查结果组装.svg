<line x1="800" y1="625" x2="800" y2="667" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="670" width="800" height="108" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="418" y="702" class="label">Check Assembler：一个 check_id 一个命名空间</text>
<text x="418" y="730" class="body">检查目标、来源、参数、覆盖与冲突；计算汇总；发布一份 Run</text>
<line x1="800" y1="778" x2="800" y2="817" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="475" y="820" width="650" height="100" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="493" y="852" class="label">run_001.json</text>
<text x="493" y="880" class="body">同一目标的一组检查与证据；已发布历史保持固定</text>
<text x="50" y="990" class="small">依据：v5 Architecture 文档与合成示例  |  状态：设计讨论稿；并非生产系统运行图</text>

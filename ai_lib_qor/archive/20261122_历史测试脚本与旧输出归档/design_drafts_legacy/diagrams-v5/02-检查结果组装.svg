<line x1="606" y1="425" x2="606" y2="457" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="992" y1="425" x2="992" y2="457" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1378" y1="425" x2="1378" y2="457" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="460" width="320" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="78" y="492" class="label">内容 / Macro 差异</text>
<text x="78" y="520" class="body">DIFF：记录变化事实</text>
<text x="78" y="544" class="body">本身不产生 PASS / FAIL</text>
<rect x="446" y="460" width="320" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="464" y="492" class="label">跨 View 检查</text>
<text x="464" y="520" class="body">QUALITY：质量检查</text>
<text x="464" y="544" class="body">覆盖不足时 NOT_CHECKED</text>
<rect x="832" y="460" width="320" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="850" y="492" class="label">STA 测量</text>
<text x="850" y="520" class="body">MEASUREMENT：WNS 数值</text>
<text x="850" y="544" class="body">记录 Corner 与来源</text>
<rect x="1218" y="460" width="320" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="1236" y="492" class="label">QoR Gate</text>
<text x="1236" y="520" class="body">EVALUATION：引用 WNS</text>
<text x="1236" y="544" class="body">按阈值产生 PASS / FAIL</text>
<line x1="1152" y1="525" x2="1215" y2="525" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1160" y="510" class="small">引用</text>

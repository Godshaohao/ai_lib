<text x="488" y="440" class="body">继承旧成员，应用明确可采用的变更</text>
<text x="488" y="464" class="body">members 是全集；changes 是相对父版的差异</text>
<line x1="800" y1="500" x2="800" y2="557" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="470" y="560" width="660" height="110" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="488" y="592" class="label">rev_0008.json：固定有效版本</text>
<text x="488" y="620" class="body">成员没有变化则不新建 Rev；质量检查可多次运行</text>
<line x1="1130" y1="615" x2="1247" y2="615" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1250" y="550" width="300" height="130" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>

<line x1="260" y1="330" x2="1340" y2="330" stroke="#2563eb" stroke-width="2"/>
<line x1="800" y1="330" x2="800" y2="377" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="470" y="380" width="660" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

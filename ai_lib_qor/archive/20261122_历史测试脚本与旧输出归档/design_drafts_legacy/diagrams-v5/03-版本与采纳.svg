<text x="68" y="225" class="body">这次交付实际出现的文件</text>
<text x="68" y="249" class="body">未归属文件保留，不能自动采用</text>
<rect x="590" y="165" width="420" height="115" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="608" y="197" class="label">Formal Snapshot 正式快照</text>
<text x="608" y="225" class="body">某次正式 NL 的固定链接状态</text>
<text x="608" y="249" class="body">无法匹配 RAW 时仍保留正式来源</text>
<rect x="1130" y="165" width="420" height="115" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

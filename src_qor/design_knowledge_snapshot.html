<script>window.DF_NODES={"BOUNDARY01": {"id": "BOUNDARY01", "title": "自动判断与人工责任边界", "type": "decision", "layer": "meta", "status": "proposed", "summary": "自动检查提供有来源、有范围的工程证据；正式 IP 使用判断和放行责任不能由执行成功或推断线索替代。", "links": [{"to": "FACT01", "relation": "supports"}, {"to": "REPORT01", "relation": "questions"}, {"to": "VALIDATE01", "relation": "requires"}], "source_path": "nodes/BOUNDARY01.md", "body": "## 需要保持的区分\n- 文件存在、路径命名、内容 Hash、Parser 提取、跨视图匹配和人工接受是不同层次的证据。\n- 未检查不等于通过；证据不足不等于已确认异常。\n- 建议性技术检查与正式发布/放行机制分开；是否接入门禁需要明确业务决策与回归。\n\n## 状态\n本节点整理了项目反复强调的边界，仍标为提议，等待维护者确认是否作为长期原则。", "body_html": "\u003ch3\u003e需要保持的区分\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e文件存在、路径命名、内容 Hash、Parser 提取、跨视图匹配和人工接受是不同层次的证据。\u003c/li\u003e\n\u003cli\u003e未检查不等于通过；证据不足不等于已确认异常。\u003c/li\u003e\n\u003cli\u003e建议性技术检查与正式发布/放行机制分开；是否接入门禁需要明确业务决策与回归。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e状态\u003c/h3\u003e\n\u003cp\u003e本节点整理了项目反复强调的边界，仍标为提议，等待维护者确认是否作为长期原则。\u003c/p\u003e", "source_md": "+++\nid = \"BOUNDARY01\"\ntitle = \"自动判断与人工责任边界\"\ntype = \"decision\"\nstatus = \"proposed\"\nsummary = \"自动检查提供有来源、有范围的工程证据；正式 IP 使用判断和放行责任不能由执行成功或推断线索替代。\"\n\n[[links]]\nto = \"FACT01\"\nrelation = \"supports\"\n\n[[links]]\nto = \"REPORT01\"\nrelation = \"questions\"\n\n[[links]]\nto = \"VALIDATE01\"\nrelation = \"requires\"\n+++\n\n## 需要保持的区分\n- 文件存在、路径命名、内容 Hash、Parser 提取、跨视图匹配和人工接受是不同层次的证据。\n- 未检查不等于通过；证据不足不等于已确认异常。\n- 建议性技术检查与正式发布/放行机制分开；是否接入门禁需要明确业务决策与回归。\n\n## 状态\n本节点整理了项目反复强调的边界，仍标为提议，等待维护者确认是否作为长期原则。\n", "freshness": {"state": "not_tracked", "reasons": [], "as_of": "2026-10-26", "reviewed_at": "", "review_after_days": null}}, "FACT01": {"id": "FACT01", "title": "检查事实与质量范围", "type": "fact", "layer": "data", "status": "unknown", "summary": "检查输出记录来源、对象、范围、证据覆盖及结果类别；缺少证据时保留未验证，不推成无变化。", "links": [{"to": "REVIEW_PIPE01", "relation": "derives_from"}, {"to": "REPORT01", "relation": "displays"}, {"to": "BOUNDARY01", "relation": "supports"}], "source_path": "nodes/FACT01.md", "body": "## 已落实的原则\n- `COMPLETE` 表示所选检查执行结束，不等同于 IP 全面质量通过。\n- 质量摘要只对本次选择的检查和输入范围负责；未运行项必须可见。\n- finding 的机器结果、证据状态和人工判断不能混为一列或互相覆盖。\n- 文件路径/名称线索、成功解析任务和语义验证属于不同证据强度。\n\n## 待核实\n- 每个解析器的“覆盖完整”含义应逐个对照其支持语法与真实库样本。\n- 跨视图配对不充分时，需要保留待核实对象，而不是推断接口一致。", "body_html": "\u003ch3\u003e已落实的原则\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eCOMPLETE\u003c/code\u003e 表示所选检查执行结束，不等同于 IP 全面质量通过。\u003c/li\u003e\n\u003cli\u003e质量摘要只对本次选择的检查和输入范围负责；未运行项必须可见。\u003c/li\u003e\n\u003cli\u003efinding 的机器结果、证据状态和人工判断不能混为一列或互相覆盖。\u003c/li\u003e\n\u003cli\u003e文件路径/名称线索、成功解析任务和语义验证属于不同证据强度。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e待核实\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e每个解析器的“覆盖完整”含义应逐个对照其支持语法与真实库样本。\u003c/li\u003e\n\u003cli\u003e跨视图配对不充分时，需要保留待核实对象，而不是推断接口一致。\u003c/li\u003e\n\u003c/ul\u003e", "source_md": "+++\nid = \"FACT01\"\ntitle = \"检查事实与质量范围\"\ntype = \"fact\"\nstatus = \"unknown\"\nsummary = \"检查输出记录来源、对象、范围、证据覆盖及结果类别；缺少证据时保留未验证，不推成无变化。\"\n\n[[links]]\nto = \"REVIEW_PIPE01\"\nrelation = \"derives_from\"\n\n[[links]]\nto = \"REPORT01\"\nrelation = \"displays\"\n\n[[links]]\nto = \"BOUNDARY01\"\nrelation = \"supports\"\n+++\n\n## 已落实的原则\n- `COMPLETE` 表示所选检查执行结束，不等同于 IP 全面质量通过。\n- 质量摘要只对本次选择的检查和输入范围负责；未运行项必须可见。\n- finding 的机器结果、证据状态和人工判断不能混为一列或互相覆盖。\n- 文件路径/名称线索、成功解析任务和语义验证属于不同证据强度。\n\n## 待核实\n- 每个解析器的“覆盖完整”含义应逐个对照其支持语法与真实库样本。\n- 跨视图配对不充分时，需要保留待核实对象，而不是推断接口一致。\n", "freshness": {"state": "not_tracked", "reasons": [], "as_of": "2026-10-26", "reviewed_at": "", "review_after_days": null}}, "FORMAL01": {"id": "FORMAL01", "title": "正式 NL 只读盘点", "type": "source", "layer": "data", "status": "unknown", "summary": "读取正式 NL 的链接和目标文件清单，汇总 IP、版本线索与视图文件分布；盘点不修改正式目录。", "links": [{"to": "IP_OBJECT01", "relation": "organizes"}, {"to": "REPORT01", "relation": "supports"}], "source_path": "nodes/FORMAL01.md", "body": "## 代码可见事实\n- 盘点逻辑位于 `src_qor/lib_guard/effective_file_tracker.py`，由工作台正式 NL 区域调用。\n- 文件类型和 Corner 统计来自链接路径、文件名及目录线索；这类统计不等同于解析文件内容。\n- 正式目录盘点与候选 RAW 检查是不同输入范围，不能混成同一结论。\n\n## 待核实\n- 真实正式树中的链接约定是否全部被识别；异常链接和不可读目录需单独看报告状态。\n- 链接名称推断出的版本/Corner 需要使用者核对，不应标为内容语义验证。", "body_html": "\u003ch3\u003e代码可见事实\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e盘点逻辑位于 \u003ccode\u003esrc_qor/lib_guard/effective_file_tracker.py\u003c/code\u003e，由工作台正式 NL 区域调用。\u003c/li\u003e\n\u003cli\u003e文件类型和 Corner 统计来自链接路径、文件名及目录线索；这类统计不等同于解析文件内容。\u003c/li\u003e\n\u003cli\u003e正式目录盘点与候选 RAW 检查是不同输入范围，不能混成同一结论。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e待核实\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e真实正式树中的链接约定是否全部被识别；异常链接和不可读目录需单独看报告状态。\u003c/li\u003e\n\u003cli\u003e链接名称推断出的版本/Corner 需要使用者核对，不应标为内容语义验证。\u003c/li\u003e\n\u003c/ul\u003e", "source_md": "+++\nid = \"FORMAL01\"\ntitle = \"正式 NL 只读盘点\"\ntype = \"source\"\nstatus = \"unknown\"\norigin = \"../lib_guard/effective_file_tracker.py\"\nsummary = \"读取正式 NL 的链接和目标文件清单，汇总 IP、版本线索与视图文件分布；盘点不修改正式目录。\"\n\n[[links]]\nto = \"IP_OBJECT01\"\nrelation = \"organizes\"\n\n[[links]]\nto = \"REPORT01\"\nrelation = \"supports\"\n+++\n\n## 代码可见事实\n- 盘点逻辑位于 `src_qor/lib_guard/effective_file_tracker.py`，由工作台正式 NL 区域调用。\n- 文件类型和 Corner 统计来自链接路径、文件名及目录线索；这类统计不等同于解析文件内容。\n- 正式目录盘点与候选 RAW 检查是不同输入范围，不能混成同一结论。\n\n## 待核实\n- 真实正式树中的链接约定是否全部被识别；异常链接和不可读目录需单独看报告状态。\n- 链接名称推断出的版本/Corner 需要使用者核对，不应标为内容语义验证。\n", "origin": "../lib_guard/effective_file_tracker.py", "freshness": {"state": "unverified", "reasons": ["unanchored_source"], "as_of": "2026-10-26", "reviewed_at": "", "review_after_days": null}}, "INTENT01": {"id": "INTENT01", "title": "项目目标与范围", "type": "intent", "layer": "meta", "status": "proposed", "summary": "以可追溯证据帮助维护者检查 IP 交付；不把工具执行状态等同于质量通过或正式放行。", "links": [{"to": "BOUNDARY01", "relation": "questions"}, {"to": "OPERATOR01", "relation": "drives"}, {"to": "READER01", "relation": "drives"}], "source_path": "nodes/INTENT01.md", "body": "## 用户目标（提议）\n- 操作者能选择库、RAW 版本和检查项，理解输入范围，查看任务进度和可追溯结果。\n- IP 阅读者能从报告理解交付内容、已确认变化、证据不足和适用范围。\n\n## 非目标\n- 本项目不替代 EDA 工具的完整语义验证，也不自动作正式发布批准。\n- 不为图谱完整而把所有原始文件或每个解析记录复制到设计知识库。\n\n## 证据\n- `src_qor/README.md` 描述检查范围、证据和质量判断边界。\n- 以上用户目标仍是产品要求提议，需由项目负责人和真实使用者复核。", "body_html": "\u003ch3\u003e用户目标（提议）\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e操作者能选择库、RAW 版本和检查项，理解输入范围，查看任务进度和可追溯结果。\u003c/li\u003e\n\u003cli\u003eIP 阅读者能从报告理解交付内容、已确认变化、证据不足和适用范围。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e非目标\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e本项目不替代 EDA 工具的完整语义验证，也不自动作正式发布批准。\u003c/li\u003e\n\u003cli\u003e不为图谱完整而把所有原始文件或每个解析记录复制到设计知识库。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e证据\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esrc_qor/README.md\u003c/code\u003e 描述检查范围、证据和质量判断边界。\u003c/li\u003e\n\u003cli\u003e以上用户目标仍是产品要求提议，需由项目负责人和真实使用者复核。\u003c/li\u003e\n\u003c/ul\u003e", "source_md": "+++\nid = \"INTENT01\"\ntitle = \"项目目标与范围\"\ntype = \"intent\"\nstatus = \"proposed\"\nsummary = \"以可追溯证据帮助维护者检查 IP 交付；不把工具执行状态等同于质量通过或正式放行。\"\n\n[[links]]\nto = \"BOUNDARY01\"\nrelation = \"questions\"\n\n[[links]]\nto = \"OPERATOR01\"\nrelation = \"drives\"\n\n[[links]]\nto = \"READER01\"\nrelation = \"drives\"\n+++\n\n## 用户目标（提议）\n- 操作者能选择库、RAW 版本和检查项，理解输入范围，查看任务进度和可追溯结果。\n- IP 阅读者能从报告理解交付内容、已确认变化、证据不足和适用范围。\n\n## 非目标\n- 本项目不替代 EDA 工具的完整语义验证，也不自动作正式发布批准。\n- 不为图谱完整而把所有原始文件或每个解析记录复制到设计知识库。\n\n## 证据\n- `src_qor/README.md` 描述检查范围、证据和质量判断边界。\n- 以上用户目标仍是产品要求提议，需由项目负责人和真实使用者复核。\n", "freshness": {"state": "not_tracked", "reasons": [], "as_of": "2026-10-26", "reviewed_at": "", "review_after_days": null}}, "IP_OBJECT01": {"id": "IP_OBJECT01", "title": "IP 与版本检查对象", "type": "object", "layer": "ia", "status": "proposed", "summary": "工作台以单个 IP 为报告隔离边界；其下登记 RAW 版本、正式目录上下文、检查运行和报告。", "links": [{"to": "RAW01", "relation": "derives_from"}, {"to": "FORMAL01", "relation": "derives_from"}, {"to": "REVIEW_PIPE01", "relation": "organizes"}, {"to": "REPORT01", "relation": "organizes"}], "source_path": "nodes/IP_OBJECT01.md", "body": "## 代码可见事实\n- Registry 中的 IP 记录包含库标识、RAW 根和版本列表，以及可选正式 NL 根。\n- `review_runner.py` 将运行按 library ID 隔离保存，并记录各检查输入身份。\n- 混合显式来源会标记为 `MIXED_EXPLICIT`，不应悄然合并成单一 RAW 版本事实。\n\n## 设计提议\n报告和链接应持续显示 IP、版本/阶段、基准范围与来源身份，避免跨 IP 或跨输入串用结果。", "body_html": "\u003ch3\u003e代码可见事实\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eRegistry 中的 IP 记录包含库标识、RAW 根和版本列表，以及可选正式 NL 根。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ereview_runner.py\u003c/code\u003e 将运行按 library ID 隔离保存，并记录各检查输入身份。\u003c/li\u003e\n\u003cli\u003e混合显式来源会标记为 \u003ccode\u003eMIXED_EXPLICIT\u003c/code\u003e，不应悄然合并成单一 RAW 版本事实。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e设计提议\u003c/h3\u003e\n\u003cp\u003e报告和链接应持续显示 IP、版本/阶段、基准范围与来源身份，避免跨 IP 或跨输入串用结果。\u003c/p\u003e", "source_md": "+++\nid = \"IP_OBJECT01\"\ntitle = \"IP 与版本检查对象\"\ntype = \"object\"\nstatus = \"proposed\"\nsummary = \"工作台以单个 IP 为报告隔离边界；其下登记 RAW 版本、正式目录上下文、检查运行和报告。\"\n\n[[links]]\nto = \"RAW01\"\nrelation = \"derives_from\"\n\n[[links]]\nto = \"FORMAL01\"\nrelation = \"derives_from\"\n\n[[links]]\nto = \"REVIEW_PIPE01\"\nrelation = \"organizes\"\n\n[[links]]\nto = \"REPORT01\"\nrelation = \"organizes\"\n+++\n\n## 代码可见事实\n- Registry 中的 IP 记录包含库标识、RAW 根和版本列表，以及可选正式 NL 根。\n- `review_runner.py` 将运行按 library ID 隔离保存，并记录各检查输入身份。\n- 混合显式来源会标记为 `MIXED_EXPLICIT`，不应悄然合并成单一 RAW 版本事实。\n\n## 设计提议\n报告和链接应持续显示 IP、版本/阶段、基准范围与来源身份，避免跨 IP 或跨输入串用结果。\n", "freshness": {"state": "not_tracked", "reasons": [], "as_of": "2026-10-26", "reviewed_at": "", "review_after_days": null}}, "OPERATOR01": {"id": "OPERATOR01", "title": "操作者任务", "type": "task", "layer": "ia", "status": "proposed", "summary": "操作者发现或选择 IP，载入 RAW/正式目录范围，选择检查，观察任务状态，并定位结果与证据。", "links": [{"to": "IP_OBJECT01", "relation": "requires"}, {"to": "WORKBENCH01", "relation": "supports"}, {"to": "REPORT01", "relation": "produces"}, {"to": "VALIDATE01", "relation": "validates"}], "source_path": "nodes/OPERATOR01.md", "body": "## 当前工作台支持\n- 左侧按 Vendor/库筛选已登记 IP。\n- RAW 版本载入后提供检查输入建议；用户仍选择要运行的检查。\n- 后台任务状态、日志入口、单 IP 报告与 Workbook 链接在工作台可见。\n- 多 LEF 选择保持显式，不因无法自动唯一配对而抹掉可独立运行的其他检查建议。\n\n## 体验验证仍缺\n代码和自动化测试证明交互存在，不证明操作者能快速理解每个选项。需要按真实任务做观察性测试并记录阻塞，而不是仅按组件数量验收。", "body_html": "\u003ch3 的 \u003ccode\u003esrc_qor\u003c/code\u003e 工具链：RAW 发现与登记、正式 NL 只读盘点、按 IP 执行检查、报告与工作台。\u003c/li\u003e\n\u003cli\u003e代码路径和测试是实现现状的依据；节点中的产品目标若未由代码或测试证明，标为“提议”或“待核实”。\u003c/li\u003e\n\u003cli\u003e原始库、正式发布目录和测试报告均留在原位置。本目录只保存设计知识及由它生成的离线 HTML。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e阅读方式\u003c/h3\u003e\n\u003cp\u003e从“数据工程”查看 RAW / 正式目录和检查输出；从“信息架构”查看操作者与阅读者的任务；从“信息设计”查看工作台和报告视图。选中节点可查看关系、状态和来源路径。\u003c/p\u003e\n\u003ch3\u003e可信度边界\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003estatus\u003c/code\u003e 表示设计知识的确认状态；HTML 中单独显示的 freshness 是来源和复核状态。当前节点尚未经过项目负责人逐项确认，因此不得把提议节点当作正式决策。检查任务 \u003ccode\u003eCOMPLETE\u003c/code\u003e 只说明所选检查执行结束，不代表库整体通过或允许发布。\u003c/p\u003e\n\u003ch3\u003e当前待核实\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e对真实使用者进行任务观察，确认操作者和 IP 阅读者的首屏信息是否足以支持其决策。\u003c/li\u003e\n\u003cli\u003e为需要持续追踪的源码证据选择小型、稳定的摘要清单；本地图不对大型 LEF、Liberty、GDS 或报告做哈希。\u003c/li\u003e\n\u003cli\u003e核对各检查器的解析覆盖边界与项目实际交付约定，避免把“未检查”解释为“无问题”。\u003c/li\u003e\n\u003c/ul\u003e", "overview_md": "# ai_lib src_qor · 项目设计知识地图\n\n\u003e 本地图从 `src_qor` 当前源码、测试与 README 汇总可追溯的工程结构，并把产品意图和待确认设计与实现事实分开。它不是 EDA 质量认证，也不替代 RAW、正式 NL、检查 Evidence 或 Excel 报告。\n\n## 目的\n\n帮助维护者回答：检查数据从哪里来、检查如何组合、结果如何传给操作者和 IP 阅读者、哪些结论仍受证据范围限制。\n\n## 当前范围\n\n- 本地图只描述独立的 `src_qor` 工具链：RAW 发现与登记、正式 NL 只读盘点、按 IP 执行检查、报告与工作台。\n- 代码路径和测试是实现现状的依据；节点中的产品目标若未由代码或测试证明，标为“提议”或“待核实”。\n- 原始库、正式发布目录和测试报告均留在原位置。本目录只保存设计知识及由它生成的离线 HTML。\n\n## 阅读方式\n\n从“数据工程”查看 RAW / 正式目录和检查输出；从“信息架构”查看操作者与阅读者的任务；从“信息设计”查看工作台和报告视图。选中节点可查看关系、状态和来源路径。\n\n## 可信度边界\n\n`status` 表示设计知识的确认状态；HTML 中单独显示的 freshness 是来源和复核状态。当前节点尚未经过项目负责人逐项确认，因此不得把提议节点当作正式决策。检查任务 `COMPLETE` 只说明所选检查执行结束，不代表库整体通过或允许发布。\n\n## 当前待核实\n\n- 对真实使用者进行任务观察，确认操作者和 IP 阅读者的首屏信息是否足以支持其决策。\n- 为需要持续追踪的源码证据选择小型、稳定的摘要清单；本地图不对大型 LEF、Liberty、GDS 或报告做哈希。\n- 核对各检查器的解析覆盖边界与项目实际交付约定，避免把“未检查”解释为“无问题”。\n", "ids": ["BOUNDARY01", "FACT01", "FORMAL01", "INTENT01", "IP_OBJECT01", "OPERATOR01", "RAW01", "READER01", "REPORT01", "REVIEW_PIPE01", "VALIDATE01", "WORKBENCH01"], "recent_events": [], "assessed_on": "2026-10-26", "freshness_counts": {"not_tracked": 6, "unverified": 6}};</script>

$('stages').addEventListener('click',ev=>{let el=ev.target.closest('[data-stage]');if(el)setStage(el.dataset.stage)});
function match(n){return (stage==='all'||(stage==='attention'?attention.has(n.freshness?.state):n.layer===stage))&&(!query||[n.id,n.title,n.summary,n.body,n.type].join(' ').toLowerCase().includes(query));}
function renderList(){let items=nodes.filter(match);$('list-title').textContent=`知识节点 · ${items.length}`;$('items').innerHTML=items.map(n=>`<button class="item ${selected===n.id?'active':''}" data-node="${esc(n.id)}"><strong><span class="s-dot ${n.status}"></span>${esc(n.title)}</strong><small>${esc(n.id)} · ${typeName[n.type]} · ${statusName[n.status]}</small><small class="extra">${esc(freshName[n.freshness?.state]||'')}</small></button>`).join('')||'<div class="empty">没有匹配节点</div>';}
$('search').addEventListener('input',ev=>{query=ev.target.value.trim().toLowerCase();renderList();renderGraph()});
$('items').addEventListener('click',ev=>{let el=ev.target.closest('[data-node]');if(el)select(el.dataset.node)});
const color={meta:'#bb8b55',data:'#188980',ia:'#617caf',design:'#9168b3'};
const ns='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent=$('world')){let e=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
function layout(){let order=['meta','data','ia','design'],width=238,gap=338;const col=order.map(k=>nodes.filter(n=>n.layer===k).sort((a,b)=>a.id.localeCompare(b.id)));let max=Math.max(...col.map(x=>x.length),1);bounds={w:1400,h:Math.max(750,max*128+120)};col.forEach((arr,i)=>arr.forEach((n,j)=>{n._x=36+i*gap;n._y=92+j*128;n._w=width;n._h=94;}));}
function lineWrap(txt,max=15){let lines=[],s='';for(const ch of Array.from(txt)){s+=ch;if(s.length>=max){lines.push(s);s='';}}if(s)lines.push(s);return lines.slice(0,2);}
function neighbor(id){let out=new Set([id]);nodes.forEach(n=>n.links.forEach(l=>{if(n.id===id)out.add(l.to);if(l.to===id)out.add(n.id)}));return out;}
function renderGraph(){const w=$('world');w.replaceChildren();['meta','data','ia','design'].forEach((lay,i)=>{let x=36+338*i;let bg=el('rect',{x:x-12,y:48,width:264,height:bounds.h-60,rx:12,fill:'#ffffff',stroke:'#edf0f6'});let h=el('text',{x:x,y:33,class:'colname'});h.textContent=({meta:'目的 / 证据',data:'01  数据工程',ia:'02  信息架构',design:'03  信息设计'})[lay];});
let focus=selected?neighbor(selected):null;
for(const n of nodes)for(const link of n.links){let target=byId.get(link.to);if(!target)continue;let x1=n._x+n._w/2,y1=n._y+n._h/2,x2=target._x+target._w/2,y2=target._y+target._h/2;let ctrl=(x2-x1)*.5;let isFocus=selected&&(selected===n.id||selected===target.id);let path=el('path',{d:`M${x1},${y1} C${x1+ctrl},${y1} ${x2-ctrl},${y2} ${x2},${y2}`,class:'edge '+(isFocus?'focus':focus?'dim':''),'marker-end':'url(#arr)'});let t=el('title',{},path);t.textContent=n.id+' '+(relName[link.relation]||link.relation)+' '+target.id;}
for(const n of nodes){let dim=(focus&&!focus.has(n.id))||(stage!=='all'&&!(stage==='attention'?attention.has(n.freshness?.state):n.layer===stage))||(query&&!match(n));let g=el('g',{transform:`translate(${n._x},${n._y})`,class:'node '+(selected===n.id?'sel ':'')+(dim?'dim':''),role:'button',tabindex:0,'aria-label':n.title});el('rect',{x:0,y:0,width:n._w,height:n._h,rx:11},g);el('rect',{x:0,y:0,width:5,height:n._h,rx:2,fill:color[n.layer]},g);
let type=el('text',{x:15,y:22,class:'small',fill:color[n.layer]},g);type.textContent=typeName[n.type]+' · '+n.id;
let label=el('text',{x:15,y:44,class:'name'},g);lineWrap(n.title).forEach((s,i)=>{let tsp=el('tspan',{x:15,dy:i?17:0},label);tsp.textContent=s});let state=el('text',{x:15,y:82,class:'small'},g);state.textContent=statusName[n.status]+' · '+(freshName[n.freshness?.state]||'未追踪');
g.addEventListener('click',()=>select(n.id));g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id)}});}
$('graph').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
}
function renderStrip(){let s=['data','ia','design'];$('strip').innerHTML=s.map(k=>{let ct=nodes.filter(n=>n.layer===k);let lbl=({data:'数据工程',ia:'信息架构',design:'信息设计'})[k];let missing=ct.filter(n=>n.status==='unknown').length;return `<div class="mini"><small>${lbl} · ${ct.length} 节点</small><strong>${missing?missing+' 项待核实':'查看信息与关系'}</strong></div>`}).join('')}
function relations(n){let arr=n.links.map(l=>({id:l.to,relation:relName[l.relation]||l.relation,out:true}));nodes.forEach(x=>x.links.forEach(l=>{if(l.to===n.id)arr.push({id:x.id,relation:relName[l.relation]||l.relation,out:false})}));return arr;}
function select(id){let n=byId.get(id);if(!n)return;selected=id;renderList();renderGraph();let list=relations(n);let f=n.freshness||{};
let freshnessDetail=`<div class="facts"><b>知识新鲜度：</b>${esc(freshName[f.state]||'未记录')}<br>
复核日期：${esc(n.reviewed_at||'无')} · 复核间隔：${n.review_after_days===undefined?'未设':n.review_after_days+' 天'}<br>
来源：${esc(n.origin||'未绑定外部来源')}<br>
${(f.reasons||[]).map(r=>'• '+esc(freshReason[r]||r)).join('<br>')||'无触发条件'}<br>
${n.review_note?'复核依据：'+esc(n.review_note):''}</div>`;
$('detail').innerHTML=`<div class="eyebrow">${esc(n.layer.toUpperCase())} / ${esc(n.id)}</div><h2>${esc(n.title)}</h2><span class="badge ${n.status}">${statusName[n.status]}</span><span class="badge">${typeName[n.type]}</span><p><span class="freshbadge ${esc(f.state||'')}">${esc(freshName[f.state]||'未追踪')}</span></p>${freshnessDetail}<p class="lead">${esc(n.summary)}</p><hr><h3>Markdown · 节点内容</h3><div class="content">${n.body_html}</div><hr><h3>知识关联 · ${list.length}</h3>${list.map(x=>`<button class="rel" data-to="${esc(x.id)}">${x.out?'→':'←'} ${esc(byId.get(x.id)?.title||x.id)}<small>${esc(x.relation)} · ${x.id}</small></button>`).join('')||'<p class="empty">暂无关联</p>'}<hr><h3>源文件</h3><div class="path">${esc(n.source_path)}</div><p><button class="plainbtn" id="show-md">查看原始 Markdown</button></p><pre class="raw" id="md" hidden></pre>`;
$('detail').querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.to)));
$('show-md').addEventListener('click',()=>{let p=$('md');p.hidden=!p.hidden;p.textContent=n.source_md;$('show-md').textContent=p.hidden?'查看原始 Markdown':'隐藏原始 Markdown'});}
function overview(){if(selected)return;let evt=manifest.recent_events||[];
let pending=nodes.filter(n=>attention.has(n.freshness?.state));
const assessed=manifest.assessed_on||'未知';
const snapshotAge=assessed==='未知'?0:Math.floor((Date.now()-Date.parse(assessed+'T00:00:00Z'))/86400000);
let queueHTML=`<h3>待复核队列 · ${pending.length}</h3>`+(pending.length?pending.map(n=>`<button class="rel" data-open="${esc(n.id)}">${esc(n.title)}<small>${esc(n.id)} · ${esc(freshName[n.freshness.state])}</small></button>`).join(''):'<p class="empty">当前没有触发复核警报；未建立策略的知识仍不代表已验证。</p>');
$('detail').innerHTML=`<div class="eyebrow">KNOWLEDGE STATUS</div><h2>项目概览</h2><p class="lead">同一项目持续更新，Markdown 是知识源，HTML 只是读取视图。</p><div class="review-banner">知识检查截至：${esc(assessed)}${snapshotAge>1?' · 此 HTML 快照已经过期，请重新构建刷新来源检查':''} · 不会自动否定原结论</div><div class="content">${manifest.overview_html}</div><hr>${queueHTML}<hr><h3>最近更新 · ${evt.length}</h3>${evt.slice().reverse().map(e=>`<div class="event"><small>${esc(e.at||'')} · ${esc((e.changes||[]).map(c=>c.id).join(', ')||e.id||'')}</small><div>${esc(e.reason||'节点更新')}</div></div>`).join('')||'<p class="empty">尚无增量更新日志</p>'}<hr><h3>使用说明</h3><p>点击节点查看源 Markdown 和关联关系。页面只读；要修改内容，请更新原有 Markdown 节点并重新执行 build.py。</p>`; $('detail').querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.open)));}
function fit(){let r=Math.max(1,$('graph').clientWidth)/Math.max(1,$('graph').clientHeight);let w=Math.max(bounds.w+45,(bounds.h+80)*r),h=w/r;view={x:(bounds.w-w)/2,y:(bounds.h-h)/2,w,h};$('graph').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);}
function zoom(f,px=.5,py=.5){let nw=Math.min(6000,Math.max(360,view.w*f)),nh=Math.min(7000,Math.max(260,view.h*f));view.x+=(view.w-nw)*px;view.y+=(view.h-nh)*py;view.w=nw;view.h=nh;$('graph').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
$('zin').onclick=()=>zoom(.8);$('zout').onclick=()=>zoom(1.25);$('fit').onclick=fit;
$('graph').addEventListener('wheel',e=>{e.preventDefault();let r=$('graph').getBoundingClientRect();zoom(e.deltaY>0?1.12:.88,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
let drag=null;$('graph').addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,baseX:view.x,baseY:view.y};$('graph').setPointerCapture(e.pointerId);$('graph').classList.add('drag')});$('graph').addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.baseX-(e.clientX-drag.x)*view.w/$('graph').clientWidth;view.y=drag.baseY-(e.clientY-drag.y)*view.h/$('graph').clientHeight;$('graph').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)});['pointerup','pointercancel'].forEach(ev=>$('graph').addEventListener(ev,()=>{drag=null;$('graph').classList.remove('drag')}));
layout();renderStrip();fit();setStage('all');
})();
</script></body></html>
